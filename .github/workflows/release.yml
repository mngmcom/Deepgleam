# Baut eine ZIP-Datei zum lokalen Spielen.
# - Push auf main: neue GitHub-Release mit der ZIP als Anhang
# - Pull Request auf main: ZIP wird nur als Test gebaut (Download am Workflow-Lauf)
name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # komplette Historie, damit die Commit-Anzahl stimmt

      - name: Version bestimmen
        id: version
        run: echo "tag=v1.0.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: ZIP bauen
        run: |
          mkdir -p dist/Deepgleam
          cp index.html game.js level.js README.md CHANGELOG.md LICENSE dist/Deepgleam/
          cd dist
          zip -r "Deepgleam-${{ steps.version.outputs.tag }}.zip" Deepgleam

      - name: ZIP als Test-Download bereitstellen (Pull Request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Deepgleam-PR-${{ github.event.number }}
          path: dist/Deepgleam/

      - name: Release erstellen (Push auf main)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "dist/Deepgleam-$TAG.zip" \
            --target "$GITHUB_SHA" \
            --title "Deepgleam $TAG" \
            --notes "ZIP herunterladen, entpacken und \`index.html\` im Browser öffnen.

          Online spielen: https://mngmcom.github.io/Deepgleam/" \
            --latest
